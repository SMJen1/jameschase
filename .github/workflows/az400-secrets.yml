name: AZ-400 Secrets Demo

on:
  workflow_dispatch:

jobs:
  secrets-demo:
    name: Verify Repository Secret
    runs-on: ubuntu-latest

    steps:
      - name: Check secret availability
        env:
          DB_PASSWORD: ${{ secrets.AZ400_DEMO_PASSWORD }}
        run: |
          if [ -n "$DB_PASSWORD" ]; then
            echo "SUCCESS: Repository secret is available"
          else
            echo "ERROR: Repository secret is missing"
            exit 1
          fi
